name: Checks

on:
  push:
    branches: [main]
  pull_request:

# Feature branches are checked through their PR, not twice through push + PR.
# Keep checking main after merges, and stop obsolete runs for the same PR/ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Match the supported Noble environment used by local WebKit testing.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:fixtures
      - run: npm run build
      - name: Install WebKit and system dependencies
        timeout-minutes: 5
        run: npx playwright install --with-deps webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
